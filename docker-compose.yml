services:
  db:
    image: pgvector/pgvector:pg17
    container_name: codebase_assistant_db

    environment:
      POSTGRES_DB: codebase_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: